name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.x' }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: gofmt -l . | (! grep .)
      - run: go vet ./...
      - run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - run: staticcheck ./...
      - run: CGO_ENABLED=1 go test -count=1 -race ./...
      - run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o dist/lanbay.exe ./cmd/lanbay
      - run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o dist/lanbay-darwin ./cmd/lanbay
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dist/lanbay-linux ./cmd/lanbay
      - run: bash scripts/check-spdx.sh
      - run: bash scripts/gen-third-party.sh && git diff --exit-code -- THIRD_PARTY_LICENSES.md
      - name: Require DCO sign-off
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            range="${{ github.event.pull_request.base.sha }}..HEAD"
          else
            range="${{ github.event.before }}..HEAD"
          fi
          git log --format=%B "$range" | grep -q '^Signed-off-by: '

  m0-kit-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.x' }
      - name: Build the Windows M0 kit
        shell: bash
        run: make ally-kit
      - name: Download, verify, extract, and return volume results
        shell: pwsh
        run: |
          $server = Start-Process go -ArgumentList 'run','./tools/kitserver','-listen','127.0.0.1:8765','-idle-timeout','2m' -NoNewWindow -PassThru -RedirectStandardOutput kitserver.out -RedirectStandardError kitserver.err
          for ($i = 0; $i -lt 40 -and -not (Test-Path kitserver.out); $i++) { Start-Sleep -Milliseconds 250 }
          for ($i = 0; $i -lt 40; $i++) {
            $line = if (Test-Path kitserver.out) { Get-Content kitserver.out -Raw } else { '' }
            if ($line -match "http://127.0.0.1:8765/[0-9a-f]+/bootstrap.ps1") { break }
            Start-Sleep -Milliseconds 250
          }
          if ($line -notmatch "http://127.0.0.1:8765/[0-9a-f]+/bootstrap.ps1") { Get-Content kitserver.err -ErrorAction SilentlyContinue; throw 'kitserver did not print bootstrap URL' }
          $script = Invoke-RestMethod $Matches[0]
          & ([ScriptBlock]::Create($script)) -NonInteractive
          $server.WaitForExit(30000)
          if (-not (Get-ChildItem m0-results -Recurse -Filter '*.zip' -ErrorAction SilentlyContinue)) { throw 'kitserver did not receive result zip' }
          Expand-Archive (Get-ChildItem m0-results -Recurse -Filter '*.zip' | Select-Object -First 1).FullName -DestinationPath received-results
          if (-not (Test-Path received-results/with-microsd.json)) { throw 'volume spike report missing' }
